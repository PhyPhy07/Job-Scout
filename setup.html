<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Scout — API keys</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0e0e10;
      --surface2: #222226;
      --border: #2e2e34;
      --accent: #f5c518;
      --text: #f4f4f5;
      --muted: #71717a;
      --good: #4ade80;
      --bad: #f87171;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      line-height: 1.55;
      min-height: 100vh;
      padding: 32px 20px 48px;
    }
    .wrap {
      max-width: 480px;
      margin: 0 auto;
    }
    h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 22px;
      color: var(--accent);
      margin-bottom: 8px;
    }
    .lede {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 20px;
    }
    label {
      font-size: 11px;
      font-family: 'DM Mono', monospace;
      color: var(--muted);
      display: block;
      margin-bottom: 6px;
    }
    input[type="password"] {
      width: 100%;
      padding: 10px 14px;
      margin-bottom: 14px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      outline: none;
    }
    .scout-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 12px 16px;
      margin-top: 6px;
      background: var(--accent);
      color: #0e0e10;
      border: none;
      border-radius: 6px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .scout-btn:hover { opacity: 0.93; }
    .links {
      margin-top: 18px;
      font-size: 12px;
      color: var(--muted);
      text-align: center;
    }
    .links a { color: var(--accent); }
    #setup-status {
      margin-top: 16px;
      padding: 12px;
      border-radius: 6px;
      font-size: 13px;
      border: 1px solid var(--border);
    }
    #setup-status[hidden] { display: none; }
    #setup-status[data-tone="good"] {
      border-color: rgba(74, 222, 128, 0.35);
      background: rgba(74, 222, 128, 0.08);
      color: var(--good);
    }
    #setup-status[data-tone="bad"] {
      border-color: rgba(248, 113, 113, 0.35);
      background: rgba(248, 113, 113, 0.08);
      color: var(--bad);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Job Scout — API keys</h1>
    <p class="lede">
      This page stays open in a tab so you can switch to Gemini or Serper, copy a key,
      paste it here, and repeat — unlike the toolbar popup, which closes when focus leaves it.
      Keys stay in <strong style="color: var(--text)">chrome.storage.local</strong> in your browser only.
    </p>

    <div>
      <label for="gemini-key">GEMINI API KEY</label>
      <input id="gemini-key" type="password" placeholder="AIza..." autocomplete="off" />
    </div>
    <div>
      <label for="serper-key">SERPER API KEY</label>
      <input id="serper-key" type="password" placeholder="..." autocomplete="off" />
    </div>
    <button type="button" class="scout-btn" id="save-keys-btn">Save keys</button>

    <div id="setup-status" hidden></div>

    <p class="links">
      Get keys:
      <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener noreferrer">Gemini</a>
      ·
      <a href="https://serper.dev" target="_blank" rel="noopener noreferrer">Serper</a>
    </p>
  </div>
  <script src="setup.js"></script>
</body>
</html>
